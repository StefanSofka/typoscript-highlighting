<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title description">
  <title id="title">Your TypoScript. Your colors.</title>
  <desc id="description">Syntax highlighting for TYPO3 11 to 14, with nine custom color categories and editor theme defaults.</desc>
  <defs>
    <linearGradient id="spectrum" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7FB069"/>
      <stop offset=".2" stop-color="#56C8D8"/>
      <stop offset=".4" stop-color="#82AAFF"/>
      <stop offset=".6" stop-color="#C4A7E7"/>
      <stop offset=".8" stop-color="#F28FAD"/>
      <stop offset="1" stop-color="#F6C177"/>
    </linearGradient>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#202434"/>
      <stop offset="1" stop-color="#131722"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" rx="16" fill="url(#background)"/>
  <rect x="36" y="34" width="6" height="152" rx="3" fill="url(#spectrum)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="68" y="87" fill="#F5F6FA" font-size="42" font-weight="700">Your TypoScript. Your colors.</text>
    <text x="70" y="124" fill="#B8BFCE" font-size="20">Spectrum picker · Hex input · Live syntax colors</text>
    <g font-size="14" font-weight="600">
      <rect x="70" y="151" width="125" height="30" rx="15" fill="#FF8700"/>
      <text x="132.5" y="171" text-anchor="middle" fill="#161A24">TYPO3 11–14</text>
      <rect x="207" y="151" width="163" height="30" rx="15" fill="#2B3044"/>
      <text x="288.5" y="171" text-anchor="middle" fill="#C4A7E7">9 syntax categories</text>
      <rect x="382" y="151" width="189" height="30" rx="15" fill="#2B3044"/>
      <text x="476.5" y="171" text-anchor="middle" fill="#82AAFF">Editor theme by default</text>
    </g>
  </g>
  <g transform="translate(880 57)">
    <rect width="154" height="108" rx="12" fill="#282D40" stroke="#3F465F"/>
    <g stroke-linecap="round" stroke-width="7">
      <path d="M22 28h51" stroke="#82AAFF"/><path d="M88 28h43" stroke="#F6C177"/>
      <path d="M22 54h29" stroke="#F28FAD"/><path d="M66 54h65" stroke="#C4A7E7"/>
      <path d="M22 80h109" stroke="#56C8D8"/>
    </g>
  </g>
</svg>
